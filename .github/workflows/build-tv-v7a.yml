name: Build Android TV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-tv-v7a.yml'
      - 'pubspec.yaml'
      - 'android/**'
      - 'lib/**'

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV v7a
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      FLUTTER_VERSION: '3.41.9'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="android/app/minireel-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using existing keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          elif [ -f "$KEYSTORE_PATH" ]; then
            echo "Using existing repository release keystore..."
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=minireel123" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=minireel" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=minireel123" >> "$GITHUB_ENV"
          else
            echo "Generating permanent release keystore and committing to repo..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias minireel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass minireel123 \
              -keypass minireel123 \
              -dname "CN=MiniReel, OU=MiniReel, O=MiniReel, L=Beijing, ST=Beijing, C=CN"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_PATH"
            git commit -m "chore: persist release signing keystore for seamless updates" || true
            git push origin main || true

            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=minireel123" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=minireel" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=minireel123" >> "$GITHUB_ENV"
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android TV APK (split-per-abi)
        run: |
          flutter build apk --release --flavor tv --split-per-abi

      - name: Organize output APKs
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          mkdir -p output
          
          # 核心产物：armeabi-v7a (32位 Android TV / 电视机顶盒通用架构)
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-tv-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-tv-release.apk output/MiniReel-${VERSION}-tv-armeabi-v7a.apk
          fi
          
          # 补充产物：arm64-v8a (64位 Android TV 架构备用)
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-tv-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-tv-release.apk output/MiniReel-${VERSION}-tv-arm64-v8a.apk
          fi
          
          ls -lh output/


      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniReel-Android-TV-APKs
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          TAG_NAME="v${VERSION}-tv-build-${{ github.run_number }}"
          gh release create "$TAG_NAME" output/*.apk \
            --title "MiniReel v${VERSION} Android TV (含 v7a)" \
            --notes "MiniReel Android TV 在线编译版本 (v${VERSION})"
